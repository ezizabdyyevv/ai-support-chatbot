<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Bright Smile Dental Clinic — Assistant</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 480px;
    margin: 40px auto;
    padding: 0 16px;
    min-height: 100vh;
    background: linear-gradient(180deg, #F2F8F4 0%, #D9E8DF 100%);
  }
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #143D39;
    border-radius: 12px 12px 0 0;
    padding: 16px 20px;
  }
  .header h2 {
    margin: 0;
    color: #fff;
    font-size: 18px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #B9D6D0;
    margin-top: 2px;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #7CD9B8;
    box-shadow: 0 0 0 3px rgba(124,217,184,0.25);
  }
  #messages {
    border: 1px solid #ccc;
    border-top: none;
    border-radius: 0 0 12px 12px;
    height: 400px;
    overflow-y: auto;
    padding: 16px;
    margin-bottom: 12px;
    background-color: #E3EDE6;
    background-image: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.9) 48%, rgba(255,255,255,0.9) 52%, transparent 70%);
    background-size: 250% 250%;
    animation: sheen-drift 14s ease-in-out infinite;
  }
  @keyframes sheen-drift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    #messages { animation: none; }
  }
  .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 10px; max-width: 80%; }
  .user { background: #DCF2E3; margin-left: auto; }
  .bot { background: #FFFFFF; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
  button { padding: 10px 16px; border-radius: 8px; border: none; background: #143D39; color: white; cursor: pointer; }
</style>
</head>
<body>
  <div class="header">
    <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="19" stroke="#7CD9B8" stroke-width="1.5" opacity="0.5"/>
      <path d="M11 19c2.5 5 6 7.5 9 7.5s6.5-2.5 9-7.5" stroke="#7CD9B8" stroke-width="2" stroke-linecap="round" fill="none"/>
    </svg>
    <div>
      <h2>Bright Smile Dental Clinic — Assistant</h2>
      <div class="status"><span class="status-dot"></span>Online</div>
    </div>
  </div>

  <div id="messages"></div>

  <form id="chatForm">
    <input id="messageInput" type="text" placeholder="Type a message..." required />
    <button type="submit">Send</button>
  </form>

<script>
  const API_URL = "/api/chat";
  const sessionId = crypto.randomUUID();

  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("messageInput");

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = `msg ${sender}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });

    const data = await response.json();
    addMessage(data.reply, "bot");
  });
</script>
</body>
</html>
