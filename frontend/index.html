<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Gülüş Dental Clinic — Sohbet</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
  #messages { border: 1px solid #ccc; border-radius: 12px; height: 400px; overflow-y: auto; padding: 16px; margin-bottom: 12px; }
  .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 10px; max-width: 80%; }
  .user { background: #DCF2E3; margin-left: auto; }
  .bot { background: #F1F1F1; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
  button { padding: 10px 16px; border-radius: 8px; border: none; background: #143D39; color: white; cursor: pointer; }
</style>
</head>
<body>
  <h2>Gülüş Dental Clinic — Sohbet</h2>
  <div id="messages"></div>
  <form id="chatForm">
    <input id="messageInput" type="text" placeholder="Bir mesaj yaz..." required />
    <button type="submit">Gönder</button>
  </form>

<script>
  const API_URL = "http://localhost:8000/api/chat";
  const sessionId = crypto.randomUUID();

  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("messageInput");

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = `msg ${sender}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });

    const data = await response.json();
    addMessage(data.reply, "bot");
  });
</script>
</body>
</html>
