<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Bright Smile Dental Clinic — Assistant</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 480px;
    margin: 40px auto;
    padding: 0 16px;
    min-height: 100vh;
    background: linear-gradient(180deg, #F2F8F4 0%, #D9E8DF 100%);
  }
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #143D39;
    border-radius: 12px 12px 0 0;
    padding: 16px 20px;
  }
  .header h2 {
    margin: 0;
    color: #fff;
    font-size: 18px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #B9D6D0;
    margin-top: 2px;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #7CD9B8;
    box-shadow: 0 0 0 3px rgba(124,217,184,0.25);
  }
  .header-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
  }
  .header-row > div:first-of-type { flex: 1; }
  #langSelect {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px;
    padding: 4px 6px;
    font-size: 12px;
  }
  #langSelect option { color: #143D39; }
  #messages {
    border: 1px solid #ccc;
    border-top: none;
    border-radius: 0 0 12px 12px;
    height: 400px;
    overflow-y: auto;
    padding: 16px;
    margin-bottom: 12px;
    background-color: #E3EDE6;
    background-image: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.9) 48%, rgba(255,255,255,0.9) 52%, transparent 70%);
    background-size: 250% 250%;
    animation: sheen-drift 14s ease-in-out infinite;
  }
  @keyframes sheen-drift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    #messages { animation: none; }
  }
  .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 10px; max-width: 80%; }
  .user { background: #DCF2E3; margin-left: auto; }
  .bot { background: #FFFFFF; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
  button { padding: 10px 16px; border-radius: 8px; border: none; background: #143D39; color: white; cursor: pointer; }
</style>
</head>
<body>
  <div class="header">
    <div class="header-row">
      <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" stroke="#7CD9B8" stroke-width="1.5" opacity="0.5"/>
        <path d="M11 19c2.5 5 6 7.5 9 7.5s6.5-2.5 9-7.5" stroke="#7CD9B8" stroke-width="2" stroke-linecap="round" fill="none"/>
      </svg>
      <div>
        <h2 id="clinicTitle">Bright Smile Dental Clinic — Assistant</h2>
        <div class="status"><span class="status-dot"></span><span id="onlineStatus">Online</span></div>
      </div>
      <select id="langSelect" aria-label="Language">
        <option value="en">EN</option>
        <option value="ru">RU</option>
        <option value="tr">TR</option>
        <option value="ka">KA</option>
      </select>
    </div>
  </div>

  <div id="messages"></div>

  <form id="chatForm">
    <input id="messageInput" type="text" placeholder="Type a message..." required />
    <button id="sendBtn" type="submit">Send</button>
  </form>

<script>
  const API_URL = "/api/chat";
  const sessionId = crypto.randomUUID();

  const UI_TEXT = {
    en: { title: "Bright Smile Dental Clinic — Assistant", online: "Online", placeholder: "Type a message...", send: "Send" },
    ru: { title: "Стоматология Bright Smile — Ассистент", online: "В сети", placeholder: "Введите сообщение...", send: "Отправить" },
    tr: { title: "Bright Smile Diş Kliniği — Asistan", online: "Çevrimiçi", placeholder: "Bir mesaj yazın...", send: "Gönder" },
    ka: { title: "Bright Smile სტომატოლოგია — ასისტენტი", online: "ონლაინ", placeholder: "დაწერეთ შეტყობინება...", send: "გაგზავნა" },
  };

  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("messageInput");
  const langSelect = document.getElementById("langSelect");
  const titleEl = document.getElementById("clinicTitle");
  const onlineEl = document.getElementById("onlineStatus");
  const sendBtn = document.getElementById("sendBtn");

  function applyLanguage(lang) {
    const t = UI_TEXT[lang];
    document.documentElement.lang = lang;
    titleEl.textContent = t.title;
    onlineEl.textContent = t.online;
    input.placeholder = t.placeholder;
    sendBtn.textContent = t.send;
  }

  langSelect.addEventListener("change", () => applyLanguage(langSelect.value));
  applyLanguage(langSelect.value);

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = `msg ${sender}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text, language: langSelect.value }),
    });

    const data = await response.json();
    addMessage(data.reply, "bot");
  });
</script>
</body>
</html>
